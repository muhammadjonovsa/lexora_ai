name: lexoraai
description: "LexoraAI - Premium AI-powered Smart Document & Text Editor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Cache & Utilities (Hive Database)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # AI & Network
  http: ^1.2.1

  # Local Cache & Utilities
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.19.0
  
  # Image, Speech & Camera
  image_picker: ^1.1.1
  google_mlkit_text_recognition: ^0.13.0
  speech_to_text: ^7.4.0

  # Documents, Printing & Sharing
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^12.0.2

  # Premium Animations
  flutter_animate: ^4.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1   # eng yangi versiyalardan biri (0.14.4 ham yaxshi)

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/img.png"   # <-- PNG bo'lishi shart!

  # Adaptive icon uchun (Android 8+ da chiroyli chiqadi, tavsiya etiladi):
  adaptive_icon_background: "#FFFFFF"   # oq fon, yoki "#00000000" shaffof
  adaptive_icon_foreground: "assets/icons/img.png"   # asosiy rasm

flutter:
  uses-material-design: true
  assets:
    - assets/icons/img.png